interface=eth0
bind-interfaces
log-dhcp
dhcp-authoritative

# Lease pool for the c8000v management interface (GigabitEthernet1)
dhcp-range=172.31.99.100,172.31.99.150,255.255.255.0,1h

# Hand out NO default route (opt 3) and NO DNS (opt 6). This keeps the test
# hermetic and deterministic: the device is confined to this subnet, so it
# cannot reach Cisco's PnP cloud and commits to option-67 ZTP. This is a test
# convenience, NOT a ZTP requirement -- if your real ZTP server is on another
# subnet you must supply a gateway, and you only need DNS if option 67 uses a
# hostname rather than an IP URL.
dhcp-option=3
dhcp-option=6

# IOS-XE ZTP over HTTP: option 67 is a full URL, so no option 150 / TFTP server
# is needed -- the device simply HTTP GETs the artifact.
dhcp-option=67,"http://172.31.99.11/ztp.py"
