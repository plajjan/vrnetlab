# DHCP for the in-band ZTP test, served on the Gi2 data link (eth1).
interface=eth1
bind-interfaces
log-dhcp
dhcp-authoritative

# Lease pool for the c8000v's Gi2 (in-band) interface.
dhcp-range=192.0.2.100,192.0.2.150,255.255.255.0,1h

# Hand out NO default route (opt 3) and NO DNS (opt 6): the ZTP/HTTP server is
# L2-adjacent on this very segment, so the device reaches it as a connected
# route -- no gateway needed. This also keeps the run hermetic (the device can't
# reach Cisco's PnP cloud) and, crucially, avoids installing a default route that
# could compete with the device's other (SLIRP) interface.
dhcp-option=3
dhcp-option=6

# IOS-XE ZTP over HTTP: option 67 is a full URL, so no option 150 / TFTP needed.
dhcp-option=67,"http://192.0.2.1/ztp.py"
